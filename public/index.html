<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050711">

  <title>DuckyMaps</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <canvas id="game"></canvas>

  <div id="topBar">
    <div class="status">
      <span id="connectionDot"></span>
      <span id="connectionText">Verbinde...</span>
    </div>

    <div class="players">
      Spieler: <span id="playerCount">0</span>
    </div>
  </div>

  <div id="namePanel">
    <input
      id="nameInput"
      maxlength="20"
      placeholder="Dein Name"
      autocomplete="off"
    >

    <button id="nameButton">Speichern</button>
  </div>

  <div id="touchControls">
    <div id="joystick">
      <div id="stick"></div>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
